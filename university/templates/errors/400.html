{% extends "base.html" %}
{% block title %}درخواست نامعتبر — سامانه مدیریت دانشگاهی{% endblock %}
{% block content %}
<div class="error-page">
  <div class="error-code">۴۰۰</div>
  <h1>درخواست نامعتبر</h1>
  <p class="page-sub">{{ description or 'درخواست ارسال‌شده معتبر نیست. صفحه را دوباره بارگذاری کنید.' }}</p>
  <a class="btn btn-primary"
     href="{{ url_for('dashboard.index') if session.get('admin_id') else url_for('auth.login') }}">
    بازگشت به سامانه
  </a>
</div>
{% endblock %}
