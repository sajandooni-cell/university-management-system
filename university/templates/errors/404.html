{% extends "base.html" %}
{% block title %}صفحه پیدا نشد — سامانه مدیریت دانشگاهی{% endblock %}
{% block content %}
<div class="error-page">
  <div class="error-code">۴۰۴</div>
  <h1>صفحه مورد نظر پیدا نشد</h1>
  <p class="page-sub">آدرس واردشده وجود ندارد یا جابه‌جا شده است. از منوی بالا برای پیمایش استفاده کنید.</p>
  <a class="btn btn-primary"
     href="{{ url_for('dashboard.index') if session.get('admin_id') else url_for('auth.login') }}">
    بازگشت به سامانه
  </a>
</div>
{% endblock %}
