{% extends "base.html" %}
{% block title %}تغییر رمز عبور — سامانه مدیریت دانشگاهی{% endblock %}
{% block content %}
<div class="page-header">
  <div>
    <h1>تغییر رمز عبور</h1>
    <p class="page-sub">برای امنیت بیشتر حساب، رمز عبور پیش‌فرض را به یک رمز قوی تغییر دهید.</p>
  </div>
  <div class="page-actions">
    <a class="btn" href="{{ url_for('dashboard.index') }}">بازگشت به داشبورد</a>
  </div>
</div>

<div class="card form-card narrow">
  <form method="post" action="{{ url_for('auth.change_password') }}" novalidate>
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <div class="form-field">
      <label for="current_password">رمز عبور فعلی</label>
      <input type="password" id="current_password" name="current_password"
             autocomplete="current-password" required>
    </div>
    <div class="form-field">
      <label for="new_password">رمز عبور جدید (حداقل ۸ کاراکتر)</label>
      <input type="password" id="new_password" name="new_password"
             autocomplete="new-password" minlength="8" required>
    </div>
    <div class="form-field">
      <label for="confirm_password">تکرار رمز عبور جدید</label>
      <input type="password" id="confirm_password" name="confirm_password"
             autocomplete="new-password" minlength="8" required>
    </div>

    <div class="form-actions">
      <button type="submit" class="btn btn-primary">ذخیره رمز عبور جدید</button>
      <a class="btn" href="{{ url_for('dashboard.index') }}">انصراف</a>
    </div>
  </form>
</div>
{% endblock %}
